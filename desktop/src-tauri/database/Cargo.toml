[package]
name = "database"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
getrandom = "0.3"
anyhow = "1.0.101"
chrono = "0.4.42"
dirs = "6.0.0"
keyring = { version = "3.6.3", features = ["apple-native", "crypto-rust", "linux-native-sync-persistent", "windows-native"] }
log = "0.4.28"
rand = "0.9.2"
ron = "0.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_with = "3.15.0"
url = "2.5.7"
whoami = "1.6.1"

[dev-dependencies]
serde_json = "1"
