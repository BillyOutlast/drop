name: Sites CI

on:
  push:
    branches: [develop]
    paths:
      - "sites/promo/**"
      - "sites/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/sites-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "sites/promo/**"
      - "sites/docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/sites-ci.yml"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts --filter radiant... --filter docs-next...

      - name: Typecheck promo site
        working-directory: sites/promo
        run: npx tsc --noEmit

      - name: Typecheck docs site
        working-directory: sites/docs
        run: npx astro check

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts --filter radiant... --filter docs-next...

      - name: Lint promo site
        working-directory: sites/promo
        run: pnpm run lint

      - name: Lint docs site
        working-directory: sites/docs
        run: pnpm run lint

      - name: Check formatting promo site
        working-directory: sites/promo
        run: pnpm run format:check

      - name: Check formatting docs site
        working-directory: sites/docs
        run: pnpm run format:check

  build:
    name: Build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out the repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpng-dev
      - name: Install pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --ignore-scripts --filter radiant... --filter docs-next...

      - name: Build promo site
        working-directory: sites/promo
        run: pnpm run build

      - name: Build docs site
        working-directory: sites/docs
        run: pnpm run build
