name: CLI CI

on:
  push:
    branches: [develop]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    branches: [develop]
    paths:
      - "cli/**"
      - ".github/workflows/cli-ci.yml"
  workflow_dispatch:

jobs:
  ci:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/rust-ci
        with:
          working-directory: cli
          cache-workspaces: "./cli -> target"
          system-dependencies: |
            sudo apt-get update
            sudo apt-get install -y libarchive-dev
          lint-command: cargo clippy --all-targets --no-deps --all-features
          coverage-path: cli/coverage.lcov
