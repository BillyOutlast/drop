name: Droplet CI

on:
  push:
    branches: [rebuild]
    paths:
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/droplet-ci.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    branches: [rebuild, develop]
    paths:
      - "libraries/droplet/**"
      - "libraries/droplet_types/**"
      - "libraries/libarchive/**"
      - ".github/workflows/droplet-ci.yml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

jobs:
  ci:
    name: Build, Test, Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: ./.github/actions/rust-ci
        with:
          working-directory: libraries/droplet
          cache-workspaces: "./libraries/droplet -> target"
          system-dependencies: |
            sudo apt-get update
            sudo apt-get install -y libarchive-dev
          lint-command: cargo clippy --all-targets --all-features -- -D warnings
          coverage-path: libraries/droplet/coverage.lcov
