ignorePatterns = [
  ".nuxt/**",
  "dist/**",
  "node_modules/**",
  "**/.next/**",
  "**/target/**",
  "server/prisma/client/**",
  "server/server/internal/__generated__/**",
]

ignoreDependencies = [
  # otp-io is a production dependency used by the server; referenced in tests
  "otp-io",
  # arktype is used across the server codebase; not listed individually
  "arktype",
]

[audit]
gate = "new-only"
